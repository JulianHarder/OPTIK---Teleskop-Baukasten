<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPTIK – Teleskop-Baukasten</title>
  <meta name="description" content="Ein Teleskop in 3D: drehen, aufschrauben und sehen, wie das Licht hindurchläuft.">

  <link rel="stylesheet" href="css/variablen.css">
  <link rel="stylesheet" href="css/grundlage.css">
  <link rel="stylesheet" href="css/leisten.css">
  <link rel="stylesheet" href="css/karten.css">
  <link rel="stylesheet" href="css/seite.css">
  <link rel="stylesheet" href="css/okular.css">
  <link rel="stylesheet" href="css/beruehmt.css">
</head>
<body>

  <main class="buehne" id="buehne" aria-label="3D-Ansicht des Teleskops"></main>

  <div class="seite" id="seite">
    <header class="kopf leiste">
      <div class="marke">
        <span class="marke-name">OPTIK</span>
        <span class="marke-zusatz">Teleskop-Baukasten</span>
      </div>
      <div class="teleskop-zeile" id="teleskop-zeile"></div>
      <button type="button" class="bauen-knopf" id="bauen-knopf" aria-expanded="false"></button>
    </header>
    <section class="beruehmt-leiste leiste" id="beruehmt" aria-label="Berühmte Teleskope"></section>
    <section class="beobachten leiste" id="beobachten" aria-label="Beobachten"></section>
    <section class="bauen leiste" id="bauen" aria-label="Selbst bauen"></section>
    <section class="datenblatt leiste" id="datenblatt" aria-label="Datenblatt"></section>
    <details class="fuss leiste" id="fuss">
      <summary>Bedienung</summary>
    </details>
  </div>

  <div class="schilder" id="schilder"></div>
  <div class="hinweis" id="hinweis" hidden></div>

  <div class="bildrate leiste" id="bildrate" hidden></div>

  <aside class="karte leiste" id="karte" aria-live="polite" hidden></aside>

  <section class="licht leiste" id="licht" aria-label="Sternlicht" hidden></section>

  <nav class="ansicht leiste" id="ansicht" aria-label="Ansicht"></nav>

  <section class="okular-blick" id="okular-blick" aria-label="Blick durchs Okular" hidden></section>


  <!--
    Klassische Skripte in fester Reihenfolge – keine ES-Module, weil
    Browser Module über file:// blockieren (siehe CLAUDE.md).
    Eigene Dateien hängen sich an globalThis.OPTIK.
  -->

  <!-- Three.js r128, lokal (MIT, siehe lib/LIZENZ-three.txt) -->
  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>

  <!-- Daten -->
  <script src="js/daten/texte.js"></script>
  <script src="js/daten/teile.js"></script>
  <script src="js/daten/teile-beruehmt.js"></script>
  <script src="js/daten/teile-weltall.js"></script>
  <script src="js/daten/teleskope.js"></script>
  <script src="js/daten/bauarten.js"></script>
  <script src="js/daten/himmel.js"></script>

  <!-- Kern -->
  <script src="js/kern/Vektor.js"></script>
  <script src="js/kern/Format.js"></script>
  <script src="js/kern/Zufall.js"></script>
  <script src="js/kern/Ereignisse.js"></script>
  <script src="js/kern/Zustand.js"></script>
  <script src="js/kern/Speicher.js"></script>

  <!-- Physik -->
  <script src="js/physik/Glas.js"></script>
  <script src="js/physik/Paraxial.js"></script>
  <script src="js/physik/Strahlverfolger.js"></script>
  <script src="js/physik/Flaeche.js"></script>
  <script src="js/physik/Optik.js"></script>
  <script src="js/physik/Linsenoptik.js"></script>
  <script src="js/physik/Historisch.js"></script>
  <script src="js/physik/Weltraumoptik.js"></script>
  <script src="js/physik/Kennzahlen.js"></script>
  <script src="js/physik/Sehen.js"></script>

  <!-- Szene -->
  <script src="js/szene/Material.js"></script>
  <script src="js/szene/Himmel.js"></script>
  <script src="js/szene/Umgebung.js"></script>
  <script src="js/szene/Weltall.js"></script>
  <script src="js/szene/Buehne.js"></script>
  <script src="js/szene/Auswahl.js"></script>
  <script src="js/szene/Beschriftung.js"></script>

  <!-- Modelle -->
  <script src="js/modell/Teile.js"></script>
  <script src="js/modell/Anbauteile.js"></script>
  <script src="js/modell/Newton.js"></script>
  <script src="js/modell/Dobson.js"></script>
  <script src="js/modell/Refraktor.js"></script>
  <script src="js/modell/Stativ.js"></script>
  <script src="js/daten/modell-mensch.js"></script>
  <script src="js/daten/modell-astronaut.js"></script>
  <script src="js/modell/Mensch.js"></script>
  <script src="js/modell/Beruehmt.js"></script>
  <script src="js/modell/Galilei.js"></script>
  <script src="js/modell/Newton1668.js"></script>
  <script src="js/modell/Yerkes.js"></script>
  <script src="js/modell/Hubble.js"></script>
  <script src="js/modell/Webb.js"></script>

  <!-- Licht -->
  <script src="js/licht/Strahlenbild.js"></script>
  <script src="js/licht/Lichtpulse.js"></script>

  <!-- Okular-Blick -->
  <script src="js/okular/Objekte.js"></script>
  <script src="js/okular/Okularblick.js"></script>

  <!-- Oberfläche -->
  <script src="js/ui/Oberflaeche.js"></script>
  <script src="js/ui/Ansicht.js"></script>
  <script src="js/ui/Infokarte.js"></script>
  <script src="js/ui/Licht.js"></script>
  <script src="js/ui/Konfigurator.js"></script>
  <script src="js/ui/Datenblatt.js"></script>
  <script src="js/ui/Beobachten.js"></script>
  <script src="js/ui/Okularansicht.js"></script>
  <script src="js/ui/Beruehmt.js"></script>

  <!-- Einstieg -->
  <script src="js/main.js"></script>
</body>
</html>
